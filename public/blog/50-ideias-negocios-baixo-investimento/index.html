  <body>
    <div id="root"></div>
    <script>
      // Carrega o bundle atual do Vite para visitantes humanos. Crawler de redes
      // sociais lê os metadados acima sem depender da execução do React.
      fetch('/index.html')
        .then((response) => response.text())
        .then((html) => {
          const documentFromApp = new DOMParser().parseFromString(html, 'text/html');
          const entry = documentFromApp.querySelector('script[type="module"]');
          if (!entry) return;
          const script = document.createElement('script');
          script.type = 'module';
          script.src = new URL(entry.getAttribute('src'), window.location.origin).toString();
          document.body.appendChild(script);
        });
    </script>
